name: Deploy to Cloud Run

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    name: ci
    uses: ./.github/workflows/ci-docker.yml

  deploy:
    name: deploy-and-smoke-test
    needs: ci
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    environment: demo
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION }}
      WIF_PROVIDER: ${{ vars.WIF_PROVIDER }}
      WIF_SERVICE_ACCOUNT: ${{ vars.WIF_SERVICE_ACCOUNT }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          : "${GCP_PROJECT_ID:?Set GCP_PROJECT_ID in the demo environment}"
          : "${GCP_REGION:?Set GCP_REGION in the demo environment}"
          : "${WIF_PROVIDER:?Set WIF_PROVIDER in the demo environment}"
          : "${WIF_SERVICE_ACCOUNT:?Set WIF_SERVICE_ACCOUNT in the demo environment}"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.WIF_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Authenticate Docker to Artifact Registry
        run: gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet

      - name: Build and push immutable image
        env:
          IMAGE: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/eventcheck/eventcheck:${{ github.sha }}
        run: |
          docker build --tag "$IMAGE" .
          docker push "$IMAGE"

      - name: Migrate and deploy
        env:
          PROJECT_ID: ${{ env.GCP_PROJECT_ID }}
          REGION: ${{ env.GCP_REGION }}
          IMAGE_TAG: ${{ github.sha }}
        run: bash deploy/release.sh

      - name: Smoke test deployed service
        env:
          SMOKE_EMAIL: ${{ vars.SMOKE_EMAIL }}
          SMOKE_PASSWORD: ${{ secrets.SMOKE_PASSWORD }}
          SMOKE_ORIGIN: ${{ vars.SMOKE_ORIGIN }}
        run: python3 deploy/smoke_test.py "$SERVICE_URL"

      - name: Publish deployment summary
        shell: bash
        run: |
          set -euo pipefail

          {
            printf '## EventCheck deployment\n\n'
            printf -- '- Release commit: `%s`\n' "$GITHUB_SHA"
            printf -- '- Deployed image: `%s`\n' "$DEPLOYED_IMAGE"
            printf -- '- Cloud Run service: %s\n' "$SERVICE_URL"
          } >> "$GITHUB_STEP_SUMMARY"
